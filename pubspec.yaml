name: xue_hua_navite_share
description: "A comprehensive cross-platform native share Flutter plugin supporting Android, iOS, macOS, Windows, Linux, and Web."
version: 1.0.0
homepage: https://github.com/Matkurban/xue_hua_navite_share
repository: https://github.com/Matkurban/xue_hua_navite_share
issue_tracker: https://github.com/Matkurban/xue_hua_navite_share/issues
topics:
  - share
  - sharing
  - airdrop
  - cross-platform
  - native-share

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_share
        pluginClass: XueHuaNaviteSharePlugin
      ios:
        pluginClass: XueHuaNaviteSharePlugin
      linux:
        pluginClass: XueHuaNaviteSharePlugin
      macos:
        pluginClass: XueHuaNaviteSharePlugin
      windows:
        pluginClass: XueHuaNaviteSharePluginCApi
      web:
        pluginClass: XueHuaNaviteShareWeb
        fileName: xue_hua_navite_share_web.dart
